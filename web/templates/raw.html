{% extends "base.html" %}
{% block title %}{{ name }}{% endblock %}
{% block content %}
<p class="crumb"><a href="{{ url_for('reports') }}">Berichte</a> / <a href="{{ url_for('report', rid=r.id) }}">{{ r.label }} vom {{ r.started | dt }}</a></p>
<h1 class="mono-title">{{ name }}</h1>
{% if text.strip() %}<pre class="raw">{{ text }}</pre>{% else %}<p class="muted">Die Datei ist leer.</p>{% endif %}
{% endblock %}
